[build-system]
requires = [
    "setuptools>=64",
    "Cython>=3",
    "numpy>=2; python_version >= '3.9'",
    # NumPy 2 requires Python 3.9. NumPy 1.22 changed the ufunc struct size.
    "numpy>=1.20,<1.22; python_version < '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Preserve the import grouping used by the existing source and tests.
known-third-party = ["pysptk"]
