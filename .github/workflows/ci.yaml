name: Python package

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check setup.py pysptk tests .github/scripts/check_packaging.py
      - run: ruff format --check setup.py pysptk tests .github/scripts/check_packaging.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-24.04
            python-version: "3.8"
            numpy: "numpy==1.20.3"
          - os: ubuntu-24.04
            python-version: "3.12"
            numpy: "numpy<2"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        env:
          NUMPY_REQUIREMENT: ${{ matrix.numpy || 'numpy' }}
        shell: bash
        run: python -m pip install ".[test]" "$NUMPY_REQUIREMENT"
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: python -m pytest --cov=pysptk --cov-report=term -q "${{ github.workspace }}/tests"

  packaging:
    name: packaging (${{ matrix.os }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: windows-2025
            architecture: x64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install build twine
      - run: python .github/scripts/check_packaging.py
