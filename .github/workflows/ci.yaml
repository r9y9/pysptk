name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check setup.py pysptk tests
      - run: ruff format --check setup.py pysptk tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-latest
            python-version: "3.8"
            numpy: "numpy==1.20.3"
          - os: ubuntu-latest
            python-version: "3.12"
            numpy: "numpy<2"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        env:
          NUMPY_REQUIREMENT: ${{ matrix.numpy || 'numpy' }}
        shell: bash
        run: python -m pip install ".[test]" "$NUMPY_REQUIREMENT"
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: python -m pytest --cov=pysptk --cov-report=term -q "${{ github.workspace }}/tests"
